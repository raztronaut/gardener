<!doctype html>
<html lang="en" data-gardener-boot="loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=900, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>The Gardener</title>
  <link rel="icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- The aurora backdrop (template-owned, stable) -->
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="grain"></div>
  </div>

  <!-- Stable shell: header / widget canvas / feedback bar -->
  <main id="stage">
    <header id="topbar">
      <div class="brand">
        <div class="title">
          <h1>The&nbsp;Gardener<span class="tm">™</span></h1>
          <p class="subline">
            <span id="subtitle">tending the garden…</span>
            <span class="subdot" aria-hidden="true">·</span>
            <!-- The garden's growth count, nestled with the wordmark. Tap → /iterations changelog. -->
            <button id="iterBadge" class="bloom" type="button" title="how the garden has grown — tap for the changelog">❀ —</button>
          </p>
        </div>
      </div>
      <div class="topright">
        <!-- Plant-a-note QR: lives in the corner (not the grid). Populated by app.js
             from state.publicUrl; hidden when no public tunnel URL is available. -->
        <a id="cornerqr" class="cornerqr" href="#" target="_blank" rel="noopener"
           aria-label="Scan to plant a note" hidden></a>
      </div>
    </header>

    <section id="garden" aria-live="polite">
      <!-- widgets mount here -->
    </section>

    <footer id="feedbackbar">
      <form id="feedbackForm" autocomplete="off">
        <span class="seed">🌱</span>
        <input id="feedbackInput" type="text" maxlength="2000" autofocus
               placeholder="Just start typing — tell the gardener what to grow.  Try /help" />
        <button type="submit" id="feedbackSend" aria-label="send feedback">Plant</button>
      </form>
    </footer>
  </main>

  <!-- Command panel (/iterations changelog, /help). Esc or click to close. -->
  <div id="panel" aria-hidden="true">
    <div class="panel-card" tabindex="-1">
      <div class="panel-head">
        <span id="panelTitle">…</span>
        <button class="panel-close" id="panelClose" type="button" aria-label="close">esc · close ✕</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>

  <!-- Opaque night overlay (energy saving). Pure black; covers everything. -->
  <div id="nightveil" aria-hidden="true"></div>

  <!-- Curb-trash alarm: full-screen flashing red, Tue 4PM → Wed 7AM, until acknowledged. -->
  <div id="trashalarm" aria-hidden="true">
    <div class="ta-inner">
      <div class="ta-icon">🗑️</div>
      <div class="ta-text">TAKE OUT<br>TRASH&nbsp;TO&nbsp;CURB</div>
      <div class="ta-sub">It’s trash night — wheel the bins out to the curb before pickup.</div>
      <button id="trashAck" type="button">✓ &nbsp;Done — it’s at the curb</button>
      <div class="ta-hint">or press <b>shift</b>&nbsp;+&nbsp;<b>T</b></div>
    </div>
  </div>

  <!-- Street-cleaning car alarm: full-screen, 1st & 3rd Mon/Wed 11AM→1PM, until acknowledged. -->
  <div id="streetalarm" aria-hidden="true">
    <div class="sa-inner">
      <div class="sa-icon">🚗</div>
      <div class="sa-text">MOVE&nbsp;YOUR<br>CAR</div>
      <div class="sa-sub">Street&nbsp;cleaning today (1st&nbsp;&amp;&nbsp;3rd Mon/Wed). Move the car now or it’s a ticket.</div>
      <button id="streetAck" type="button">✓ &nbsp;Done — car is moved</button>
      <div class="sa-hint">street sweeping · 11 AM</div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast" role="status"></div>

  <!-- Custom cursor: a green dot, hidden when idle; on movement it fades in big then shrinks. -->
  <div id="cursor" aria-hidden="true"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
